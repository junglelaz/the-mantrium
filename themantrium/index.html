<script>
(function(){
 const mobile=matchMedia('(pointer:coarse),(max-width:650px)');
 const root=document.documentElement;
 const guide=document.querySelector('#instructions'),footer=guide.parentElement;
 function fitGuide(){
  const active=mobile.matches && guide.textContent.includes('Double Tap = Pulse');
  footer.classList.toggle('fitted-controls',active);
  if(!active)return;
  const pad=document.querySelector('#joystick').getBoundingClientRect();
  if(!pad.width)return;
  const leftControl=[document.querySelector('.temple-exit-label'),document.querySelector('#hud')]
   .find(el=>el && el.getBoundingClientRect().width && getComputedStyle(el).visibility==='visible');
  const right=Math.max(0,document.documentElement.clientWidth-pad.right);
  const left=leftControl?leftControl.getBoundingClientRect().left:right;
  footer.style.setProperty('--guide-left',left+'px');
  footer.style.setProperty('--guide-right',right+'px');
  footer.style.setProperty('--guide-size','16px');
  const width=guide.getBoundingClientRect().width;
  if(width>0)footer.style.setProperty('--guide-size',(16*(pad.right-left)/width)+'px');
 }
 let pending=false;
 function measureControls(){
  pending=false;
  fitGuide();
  let ceiling=innerHeight;
  if(mobile.matches)for(const el of document.querySelectorAll('#joystick,#hud,.temple-exit-label')){
   const rect=el.getBoundingClientRect();
   if(rect.height && getComputedStyle(el).visibility==='visible')ceiling=Math.min(ceiling,rect.top-12);
  }
  root.style.setProperty('--control-ceiling',ceiling+'px');
  root.style.setProperty('--control-inset',(innerHeight-ceiling)+'px');
  root.dataset.controlCeiling=String(ceiling);
 }
 function queueMeasure(){if(!pending){pending=true;requestAnimationFrame(measureControls)}}
 const observed=new WeakSet(), sizes=new ResizeObserver(queueMeasure);
 function watchControls(){for(const el of document.querySelectorAll('#joystick,#hud,.temple-exit-label'))if(!observed.has(el)){observed.add(el);sizes.observe(el)}queueMeasure()}
 watchControls();
 new MutationObserver(queueMeasure).observe(guide,{childList:true,characterData:true,subtree:true});
 document.fonts?.ready.then(queueMeasure);
 new MutationObserver(watchControls).observe(document.body,{attributes:true,attributeFilter:['class']});
 addEventListener('resize',queueMeasure);
 document.addEventListener('animationend',queueMeasure);
 mobile.addEventListener('change',queueMeasure);
 const screen=document.getElementById('arrival'),status=document.getElementById('arrival-status');
 let timer;
 function showRetry(message){
  if(!screen.isConnected)return;
  status.setAttribute('aria-live','polite');status.textContent=message;
  if(screen.querySelector('button'))return;
  const button=document.createElement('button');
  button.textContent='Try again';
  button.onclick=()=>location.reload();
  screen.append(button);
 }
 timer=setTimeout(()=>showRetry('Still connecting to the sanctuary.'),25000);
 import('./arrival-fluid251.js').catch(error=>{
  console.error('Mantrium startup',error);
  const detail=String(error.message||error);
  const network=/fetch|network|load failed|module script|importing a module|import a module/i.test(detail);
  let retry=false;
  if(network){try{
   const key='mantrium-reconnect-249',previous=Number(sessionStorage.getItem(key)||0);
   if(Date.now()-previous>120000){sessionStorage.setItem(key,String(Date.now()));retry=true;}
  }catch{}}
  if(retry){status.textContent='Reconnecting to the sanctuary…';setTimeout(()=>location.reload(),1200);}
  else showRetry(network?'Connection interrupted while loading the sanctuary.':/webgl/i.test(detail)?'The 3D renderer could not start.':'The 3D scene could not start.');
 }).finally(()=>clearTimeout(timer));
})();
