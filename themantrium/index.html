<script>
(function(){
 const screen=document.getElementById('arrival'),status=document.getElementById('arrival-status');
 let timer;
 function showRetry(message){
  if(!screen.isConnected)return;
  status.setAttribute('aria-live','polite');status.textContent=message;
  if(screen.querySelector('button'))return;
  const button=document.createElement('button');
  button.textContent='Try again';
  button.onclick=()=>location.reload();
  screen.append(button);
 }
 timer=setTimeout(()=>showRetry('Still connecting to the sanctuary.'),25000);
 import('./arrival-fluid251.js').catch(error=>{
  console.error('Mantrium startup',error);
  const detail=String(error.message||error);
  const network=/fetch|network|load failed|module script|importing a module|import a module/i.test(detail);
  let retry=false;
  if(network){try{
   const key='mantrium-reconnect-249',previous=Number(sessionStorage.getItem(key)||0);
   if(Date.now()-previous>120000){sessionStorage.setItem(key,String(Date.now()));retry=true;}
  }catch{}}
  if(retry){status.textContent='Reconnecting to the sanctuary…';setTimeout(()=>location.reload(),1200);}
  else showRetry(network?'Connection interrupted while loading the sanctuary.':/webgl/i.test(detail)?'The 3D renderer could not start.':'The 3D scene could not start.');
 }).finally(()=>clearTimeout(timer));
})();
</script></body></html>
